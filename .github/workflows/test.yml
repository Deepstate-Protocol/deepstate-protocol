name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out submodules
        shell: bash
        env:
          DEEPSTATE_CONTRACTS_DEPLOY_KEY: ${{ secrets.DEEPSTATE_CONTRACTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEEPSTATE_CONTRACTS_DEPLOY_KEY" > ~/.ssh/deepstate_contracts_deploy_key
          chmod 600 ~/.ssh/deepstate_contracts_deploy_key
          trap 'rm -f ~/.ssh/deepstate_contracts_deploy_key' EXIT
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deepstate_contracts_deploy_key -o IdentitiesOnly=yes"
          git submodule update --init --recursive --depth 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
